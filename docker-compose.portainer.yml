version: '3.8'

services:
  chronos:
    build:
      context: https://github.com/gerben007/chronos.git#claude/new-session-5fOED
      dockerfile: apps/site/Dockerfile
    container_name: chronos-site
    ports:
      - "3000:3000"
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - SITE_BASE_URL=https://chronos.internal
    labels:
      com.example.description: "Chronos timeline site"
