# Chronos — nginx config skeleton.
# Serves the static Astro `dist/` with strict security headers.
# CSP nonces / hashes will be wired in by the Astro build once components exist.

worker_processes auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    server_tokens      off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss text/javascript
               image/svg+xml application/wasm;

    map $sent_http_content_type $cache_control {
        default                           "public, max-age=60";
        ~^text/html                       "public, max-age=60";
        ~^application/json                "public, max-age=60";
        ~^(image|font|application/wasm)   "public, max-age=31536000, immutable";
        ~^text/(css|javascript)           "public, max-age=31536000, immutable";
    }

    server {
        listen 8080 default_server;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # ── Security headers (defence in depth — CF also enforces) ────────────
        add_header Strict-Transport-Security  "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options     "nosniff"                                       always;
        add_header X-Frame-Options            "DENY"                                          always;
        add_header Referrer-Policy            "strict-origin-when-cross-origin"               always;
        add_header Permissions-Policy         "camera=(), microphone=(), geolocation=(), interest-cohort=()" always;
        add_header Cross-Origin-Opener-Policy "same-origin"                                   always;
        add_header Cross-Origin-Resource-Policy "same-origin"                                 always;

        # CSP — will be tightened once Astro emits script hashes.
        # `script-src 'self'` only; no inline scripts permitted.
        add_header Content-Security-Policy "
            default-src 'self';
            script-src  'self';
            style-src   'self' 'unsafe-inline';
            img-src     'self' data: https://nextcloud.stratusfinance.co.za https://commons.wikimedia.org;
            media-src   'self' https://nextcloud.stratusfinance.co.za;
            font-src    'self';
            connect-src 'self';
            frame-ancestors 'none';
            base-uri    'self';
            form-action 'self';
            object-src  'none';
            upgrade-insecure-requests;
        " always;

        add_header Cache-Control $cache_control always;

        # ── /admin/* surfaces only behind Cloudflare Access (enforced upstream).
        # nginx still serves the placeholder; admin_api lives in the ingest container.
        location /admin/ {
            try_files $uri $uri/ /admin/index.html;
        }

        # ── Static API (Phase 2) — long-lived cache + CORS for read-only clients.
        location /api/v1/ {
            add_header Access-Control-Allow-Origin "*"          always;
            add_header Access-Control-Allow-Methods "GET, OPTIONS" always;
            add_header Cache-Control "public, max-age=60"        always;
            try_files $uri =404;
        }

        # ── Default static serving with SPA-friendly fallback.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # ── Reject unknown methods.
        if ($request_method !~ ^(GET|HEAD|OPTIONS)$) {
            return 405;
        }

        error_page 404 /404.html;
    }
}
