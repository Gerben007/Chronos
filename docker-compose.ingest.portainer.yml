version: '3.8'

# Chronos ingest stack — runs the cron-style loop that polls Nextcloud,
# classifies files via Haiku, and refreshes the public resources.json.
#
# Build the image once on the host (build context is the repo root):
#   cd ~/chronos-deploy/chronos && \
#   docker build -t chronos-ingest:latest -f apps/ingest/Dockerfile .
#
# Initialise the SQLite DB once (run as root so the volume is writable):
#   docker run --rm --user 0:0 -v chronos-db:/data/db chronos-ingest:latest \
#     sh -c "chown -R 1000:1000 /data/db && \
#            python -m chronos_ingest.seed --db /data/db/chronos.db && \
#            chown -R 1000:1000 /data/db"
#
# Preview the tree (no writes, no AI):
#   docker run --rm --env-file .env -v chronos-db:/data/db \
#     chronos-ingest:latest python -m chronos_ingest list
#
# Run a one-shot tick:
#   docker run --rm --env-file .env -v chronos-db:/data/db \
#     -v chronos-dist-data:/data/dist chronos-ingest:latest \
#     python -m chronos_ingest tick -v
#
# Deploy this stack via Portainer; it runs `loop` mode (auto-tick every
# TICK_INTERVAL_SECONDS).

services:
  clamav:
    image: clamav/clamav:latest
    container_name: chronos-clamav
    restart: unless-stopped
    # Freshclam runs on startup; first boot pulls signatures (~5 min).
    # Subsequent restarts use the cached DB. The clamd socket lives at
    # /tmp/clamd.sock by default; we expose it via a shared volume.
    environment:
      - CLAMAV_NO_FRESHCLAMD=false
      - CLAMD_STARTUP_TIMEOUT=600
    volumes:
      - clamav-db:/var/lib/clamav
      - clamav-socket:/tmp                  # exposes clamd.sock
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 360s                    # allow time for first signature pull
    networks:
      - nginx_default
    labels:
      com.example.description: "Chronos ClamAV scanner"

  chronos-ingest:
    image: chronos-ingest:latest
    container_name: chronos-ingest
    restart: unless-stopped
    command: ["python", "-m", "chronos_ingest", "loop", "-v"]
    depends_on:
      clamav:
        condition: service_started        # service_healthy needs ~6 min first run
    environment:
      - NEXTCLOUD_URL=${NEXTCLOUD_URL}
      - NEXTCLOUD_USER=${NEXTCLOUD_USER}
      - NEXTCLOUD_APP_PASSWORD=${NEXTCLOUD_APP_PASSWORD}
      - NEXTCLOUD_ROOT_PATH=/Chronos
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_MODEL=claude-haiku-4-5-20251001
      - DAILY_HAIKU_BUDGET_USD=1.00
      - SQLITE_PATH=/data/db/chronos.db
      # SKIP_VIRUS_SCAN: true while ClamAV is warming up (~5 min first run),
      # then flip to false. The ingest loop fails closed if clamd is
      # unreachable while SKIP_VIRUS_SCAN=false.
      - SKIP_VIRUS_SCAN=${SKIP_VIRUS_SCAN:-false}
      - CLAMAV_SOCKET=/clamav-socket/clamd.sock
      - TICK_INTERVAL_SECONDS=60
      - RESOURCES_OUTPUT_PATH=/data/dist/resources.json
      # Excel-driven entries authoring (drop entries.xlsx in /Chronos/).
      - ENTRIES_XLSX_NAME=entries.xlsx
      - ENTRIES_JSON_PATH=/repo/db/seed/entries.json
      - LANES_JSON_PATH=/repo/db/seed/lanes.json
      - REPO_PATH=/repo
      # Set SITE_IMAGE_NAME to enable auto-rebuild on entries change.
      - SITE_IMAGE_NAME=${SITE_IMAGE_NAME:-chronos:latest}
      - SITE_DOCKERFILE_PATH=apps/site/Dockerfile
      - SITE_CONTAINER_NAME=chronos-site
    volumes:
      - chronos-db:/data/db
      - chronos-dist-data:/data/dist
      - clamav-socket:/clamav-socket           # clamd.sock is read+write
      # Repo bind-mount so we can read seed/entries.json and run docker build.
      - ${CHRONOS_REPO_PATH:-/home/gerben/chronos-deploy/chronos}:/repo
      # Docker socket for image rebuild + container recreate.
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - nginx_default
    labels:
      com.example.description: "Chronos ingest loop"

  chronos-admin:
    image: chronos-ingest:latest
    container_name: chronos-admin
    restart: unless-stopped
    command:
      - "uvicorn"
      - "chronos_ingest.admin_api:app"
      - "--host=0.0.0.0"
      - "--port=8001"
      - "--no-server-header"
    environment:
      - SQLITE_PATH=/data/db/chronos.db
      # ADMIN_AUTH_MODE: 'cf_access' (production with Cloudflare in front)
      # or 'none' (trust upstream proxy — pair with NPM Access List).
      - ADMIN_AUTH_MODE=${ADMIN_AUTH_MODE:-none}
      - ADMIN_PROXY_ACTOR=${ADMIN_PROXY_ACTOR:-gerben@local}
      - CF_ACCESS_TEAM=${CF_ACCESS_TEAM:-}
      - CF_ACCESS_AUD=${CF_ACCESS_AUD:-}
      - RESOURCES_OUTPUT_PATH=/data/dist/resources.json
    volumes:
      - chronos-db:/data/db
      - chronos-dist-data:/data/dist
    networks:
      - nginx_default
    labels:
      com.example.description: "Chronos admin API (FastAPI, CF Access-gated)"

volumes:
  chronos-db:
  chronos-dist-data:
  clamav-db:
  clamav-socket:

networks:
  nginx_default:
    external: true
